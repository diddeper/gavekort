# Gavekort configuration. Paths are relative to this file.

# The Apps Script web app's /exec URL (Deploy → Manage deployments).
# Leave empty until deployed: `generate` refuses to run without it, `preview` works anyway.
web_app_url = "https://script.google.com/macros/s/AKfycbzzLkabzOrhgmFuQxWDhlaIY_UpU89p5qzU9748VopS-iScEM86QKRY7ydkf_tGq-7btQ/exec"

validity_text = "Gyldig i 12 måneder fra kjøpsdato"
output_dir = "output"

[brand]
business_name = "Legreid muskel- og massasjeterapeut"  # PDF author metadata only
name = "Janne Legreid"                         # large name on the card; "" to leave out
tagline = "Muskel- og massasjeterapeut"        # small line under the name; "" to leave out
background_color = "#c6a792"
text_color = "#111111"
mark = "assets/mark.svg"                       # single-color SVG (straight-line paths); "" for none
booking_url = "https://system.easypractice.net/book/legreid-muskel-og-massasjeterapeut#choose-service"
booking_text = "Book time – trykk her"          # clickable in the PDF; empty → shortened URL
scan_text = "Skannes ved oppmøte"              # small caption under the QR; "" to leave out
font_light = "assets/fonts/Montserrat-Light.ttf"       # name and title; empty → regular
font_regular = "assets/fonts/Montserrat-Regular.ttf"   # optional .ttf; empty → Helvetica
font_bold = "assets/fonts/Montserrat-Medium.ttf"       # labels, code and booking link; empty → regular

[cards.60]
title = "60 minutter massasje"

[cards.90]
title = "90 minutter massasje"
